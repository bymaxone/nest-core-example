# CI — thin caller of the org-wide reusable pipeline (bymaxone/.github).
#
# The whole pipeline (install, lint, typecheck, format, coverage, e2e, export
# audit, mutation) lives in bymaxone/.github so every repo shares one
# definition. The reusable's `library-repo` input clones and builds the
# sibling @bymax-one/nest-core checkout so apps/api's `file:` dependency
# resolves in CI exactly as it does locally — no manual clone+build step here.
# API e2e (pure supertest, no external infra) and the Playwright web smoke
# (against production-built api+web) both run, as do the library export-usage
# audit (`pnpm audit:exports`) and Stryker mutation (`pnpm mutation`, gated to
# default-branch pushes and manual dispatch inside the reusable). The reusables
# are versioned via the @v1 tag on bymaxone/.github.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs for the same ref so only the latest commit is verified.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege at the caller; the reusables request no more than this.
permissions:
  contents: read

jobs:
  ci:
    uses: bymaxone/.github/.github/workflows/node-ci.yml@v1
    with:
      library-repo: bymaxone/nest-core
      has-web: true
      run-e2e-web: true
      run-e2e-api: true
      run-export-audit: true
      run-mutation: true

  security:
    # Dependency review needs the repository dependency graph, which is only
    # available on public repositories (or private ones with GitHub Advanced
    # Security). Gate on public visibility so this stays inert while the repo is
    # private and self-activates on the public flip, and only on a pull request
    # (it diffs the PR's dependency changes).
    if: ${{ github.event_name == 'pull_request' && !github.event.repository.private }}
    uses: bymaxone/.github/.github/workflows/security.yml@v1
    with:
      fail-on-severity: high

  # Single check the org ruleset can require, in every repo, under one name.
  #
  # A required status check is matched by literal name, and this repo's jobs are
  # named nothing like the next repo's — so there is no list of contexts that
  # works org-wide. One aggregate per repo, always spelled `CI passed`, is what
  # makes a single rule at the organisation level possible, and what makes every
  # repository created from now on inherit the gate without being configured.
  #
  # `always()` is what makes this a gate rather than decoration: without it the
  # job is skipped the moment a dependency fails, and a skipped check reports
  # neutral — the pull request would look unblocked precisely when it is broken.
  # `cancelled` is named explicitly for the same reason; a cancelled job is not
  # a passing one, and a queue timeout produces exactly that.
  #
  # A skipped dependency is accepted on purpose: jobs here are conditional on the
  # event, and failing on skip would break every push that legitimately runs a
  # subset.
  ci-pass:
    name: CI passed
    if: always()
    needs: [ci, security]
    runs-on: ubuntu-latest
    steps:
      - name: Fail when any dependency did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
