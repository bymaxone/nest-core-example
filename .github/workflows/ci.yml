# CI — thin caller of the org-wide reusable pipeline (bymaxone/.github).
#
# The whole pipeline (install, lint, typecheck, format, coverage, e2e, export
# audit, mutation) lives in bymaxone/.github so every repo shares one
# definition. The reusable's `library-repo` input clones and builds the
# sibling @bymax-one/nest-core checkout so apps/api's `file:` dependency
# resolves in CI exactly as it does locally — no manual clone+build step here.
# Web, API e2e, export-audit and mutation stay off until their app/scripts
# exist; flip the matching input once they land. The reusables are versioned
# via the @v1 tag on bymaxone/.github.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs for the same ref so only the latest commit is verified.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege at the caller; the reusables request no more than this.
permissions:
  contents: read

jobs:
  ci:
    uses: bymaxone/.github/.github/workflows/node-ci.yml@v1
    with:
      library-repo: bymaxone/nest-core
      has-web: false
      run-e2e-api: false
      run-export-audit: false
      run-mutation: false

  security:
    # Dependency review needs the repository dependency graph, which is only
    # available on public repositories (or private ones with GitHub Advanced
    # Security). Gate on public visibility so this stays inert while the repo is
    # private and self-activates on the public flip, and only on a pull request
    # (it diffs the PR's dependency changes).
    if: ${{ github.event_name == 'pull_request' && !github.event.repository.private }}
    uses: bymaxone/.github/.github/workflows/security.yml@v1
    with:
      fail-on-severity: high
