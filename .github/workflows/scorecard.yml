name: OSSF Scorecard

# Publishes the OpenSSF Scorecard (https://github.com/ossf/scorecard) result to
# the repository's Security tab and to the public viewer at scorecard.dev. The
# weekly schedule keeps the score fresh even when no code lands; the push
# trigger catches regressions immediately (for example branch protection
# removed).
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1' # Mondays 04:00 UTC
  workflow_dispatch:

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

# Default to read-only; specific permissions are widened at the job level.
permissions: read-all

jobs:
  visibility:
    name: Repository visibility
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      public: ${{ steps.check.outputs.public }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail

          # Retried rather than trusted once: a rate limit or a blip would
          # otherwise decide whether the repository counts as public.
          visibility=""
          for attempt in 1 2 3; do
            visibility=$(gh api "repos/$REPO" --jq .visibility 2>/dev/null) && break
            sleep $(( attempt * 5 ))
          done

          if [ -z "$visibility" ]; then
            # Degrade to "not public" instead of failing the workflow. The scan
            # cannot run without knowing, and a red workflow over a transient API
            # error is noise; the warning keeps it from being silent.
            echo "::warning::Could not determine repository visibility after 3 attempts; treating it as non-public."
            echo "public=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "visibility: $visibility"
          if [ "$visibility" = "public" ]; then
            echo "public=true" >> "$GITHUB_OUTPUT"
          else
            # Covers internal as well as private: neither can publish results.
            echo "public=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipped on a $visibility repository."
          fi

  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Scorecard publishes SARIF to the Security tab and mints an OIDC token
    # for the public scorecard.dev viewer; neither works on a private
    # repository without GitHub Advanced Security. This repository is private
    # today, so the job stays inert (reported as skipped) until it is made
    # public, at which point the visibility job below reports it and this runs.
    needs: visibility
    if: ${{ needs.visibility.outputs.public == 'true' }}

    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 30

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4
        with:
          sarif_file: results.sarif
          category: ossf-scorecard
